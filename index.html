<!doctype html><html lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hanzi Flashcards"><title>Hanzi Flashcards</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon.svg"><link rel="stylesheet" href="./styles.css"></head><body>
<div class="app"><header class="topbar"><div class="brand"><p class="eyebrow">中文 · FLASHCARDS</p><p class="creator">made by Akazawa</p><h1>Hanzi Flashcards</h1></div>
<div class="header-actions"><nav class="tabs"><button class="tab is-active" data-tab="practice">Practice</button><button class="tab" data-tab="dictionary">Dictionary</button><button class="tab" data-tab="saved">Saved (0)</button></nav>
<label class="language-picker"><span>Meaning</span><select id="language-select"><option value="en">EN</option><option value="jp">日本語</option><option value="tr">TR</option></select></label><button class="theme-toggle" id="theme-toggle">Light</button></div></header>
<p class="install-hint" id="install-hint" hidden>iPhone: Safari → Paylaş → Ana Ekrana Ekle <button id="dismiss-hint">Tamam</button></p>

<section id="practice-view"><div class="toolbar"><div class="filters"><button class="chip is-active" data-level="All">All</button><button class="chip" data-level="Learned">Learned</button><button class="chip" data-level="HSK 1">HSK 1</button><button class="chip" data-level="HSK 2">HSK 2</button><button class="chip" data-level="HSK 3">HSK 3</button><button class="chip" data-level="HSK 4">HSK 4</button><button class="chip" data-level="HSK 5">HSK 5</button><button class="chip" data-level="HSK 6">HSK 6</button><button class="chip" data-level="HSK 7–9">HSK 7–9</button></div><p class="progress" id="progress"></p></div>
<article class="card"><button class="card-face" id="practice-face"><span class="card-hint" id="practice-hint">Tap to reveal</span><span class="hanzi" id="practice-hanzi"></span><span class="pinyin always-pinyin" id="practice-pinyin"></span><div class="reveal" id="practice-reveal"><p class="meaning" id="practice-meaning"></p></div><span class="level-chip" id="practice-level"></span></button>
<div class="card-actions"><button class="ghost" id="speak-btn">🔊 Hear</button><button class="save" id="save-btn">Save</button></div></article>
<div class="nav-row"><button class="nav-btn" id="prev-btn">← Previous</button><button class="nav-btn primary" id="next-btn">Next →</button></div><p class="footnote">HSK 3.0 · 2026 dataset. Swipe left/right on iPhone. Pinyin is always visible; tap the card for the selected meaning.</p></section>

<section id="dictionary-view" hidden><div class="toolbar"><input class="search" id="dictionary-search" placeholder="Search 中文, pinyin, English, 日本語, Türkçe"></div><div class="dictionary-list" id="dictionary-list"></div></section>
<section id="saved-view" hidden><div class="toolbar"><input class="search" id="search" placeholder="Search saved cards"></div><div class="empty" id="empty-state" hidden><p id="empty-title">No saved cards yet.</p><p id="empty-copy">Practice a card and tap Save to build your study list.</p><button class="nav-btn primary" id="go-practice">Go to Practice</button></div><div class="grid" id="saved-grid"></div></section></div>
<nav class="bottom-nav"><button class="tab is-active" data-tab="practice">Practice</button><button class="tab" data-tab="dictionary">Dictionary</button><button class="tab" data-tab="saved">Saved (0)</button></nav>
<script type="module" src="./app.js"></script></body></html>
